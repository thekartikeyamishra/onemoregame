<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0f1f">
<title>ONE MORE · Offline practice</title>
<style>
  :root { color-scheme: dark; --sa-top: env(safe-area-inset-top); --sa-left: env(safe-area-inset-left); --sa-right: env(safe-area-inset-right); }
  html, body { margin: 0; height: 100%; background: #060912; color: #eef1fa; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  #overlay { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: rgba(6,9,18,.86); }
  #overlay[hidden] { display: none; }
  .brand { letter-spacing: .3em; font-weight: 800; color: #3ee6f0; font-size: 14px; }
  h1 { margin: 0; font-size: clamp(22px, 6vw, 34px); }
  p { margin: 0 auto; max-width: 34ch; color: #a9b2cf; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  button { font: 700 16px system-ui, sans-serif; min-height: 48px; padding: 0 22px; border-radius: 12px; border: 1px solid rgba(160,180,255,.28); background: #0e1530; color: #eef1fa; cursor: pointer; }
  button.primary { background: #3ee6f0; color: #06101a; border-color: #3ee6f0; }
  #dash { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); min-width: 96px; min-height: 64px; background: #ffbf47; color: #0a0f1f; border: 0; }
  #dash[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="arena" aria-label="Practice arena. Drag anywhere to steer on touch screens, or use arrow keys, WASD or the mouse. Space, a second finger or double-tap to dash."></canvas>
<div id="overlay" role="dialog" aria-labelledby="title">
  <div class="brand">ONE MORE</div>
  <h1 id="title">You're offline</h1>
  <p id="sub">Play an unranked Practice run while you wait.</p>
  <div class="row">
    <button id="start" class="primary" type="button">Practice offline</button>
    <button id="retry" type="button">Reconnect</button>
  </div>
</div>
<button id="dash" type="button" hidden>Dash</button>
<script src="offline.js"></script>
</body>
</html>

# Cloud builds for the ONE MORE apps (lets you build and upload the iOS app without owning a Mac).
# Setup (once): codemagic.io → add this GitHub repo → Teams → Integrations → App Store Connect API key
# (name it "onemore_asc"); upload your Android keystore under Code signing → Android keystores (reference "onemore_upload").
# Then start the "ios-release" or "android-release" workflow. See docs/MOBILE-STORES.md.
workflows:
  ios-release:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: onemore_asc
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kartikeyamishra.onemore
    scripts:
      - name: Install and sync
        working_directory: mobile
        script: |
          npm ci
          npm run sync
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd mobile/ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 100))
      - name: Build IPA
        script: xcode-project build-ipa --project "mobile/ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android → AAB
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      android_signing:
        - onemore_upload
    scripts:
      - name: Install and sync
        working_directory: mobile
        script: |
          npm ci
          npm run sync
      - name: Build signed App Bundle
        working_directory: mobile/android
        script: ./gradlew bundleRelease -PversionCode=$((BUILD_NUMBER + 100))
    artifacts:
      - mobile/android/app/build/outputs/bundle/release/*.aab
